name: goguma-ios

# Builds an unsigned iOS IPA for goguma (https://codeberg.org/emersion/goguma),
# an IRC client for mobile devices written in Flutter.
# No source overlay: goguma is built straight from upstream.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner image'
        required: true
        default: 'xcode-27'
        type: choice
        options:
          - xcode-27
          - macos-26
          - macos-latest
      label:
        description: 'artifact label suffix'
        required: false
        default: 'goguma'
      flutter_version:
        description: 'Flutter SDK version'
        required: false
        default: '3.47.8'
      ref:
        description: 'goguma git ref (branch/tag/commit)'
        required: false
        default: 'master'
      skip_build:
        description: 'only run pub get + pod install (fast smoke test, no IPA)'
        required: false
        default: 'false'
      patch_uiscene:
        description: 'apply overlay-goguma (UIScene migration, required for iOS 27)'
        required: false
        default: 'false'

permissions:
  contents: read

jobs:
  build-ios:
    name: "Build unsigned IPA (goguma)"
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Clone goguma (Codeberg)
        run: |
          set -euo pipefail
          git clone https://codeberg.org/emersion/goguma.git app
          cd app
          git checkout "${{ inputs.ref }}"
          echo "commit=$(git rev-parse HEAD)"
          git log --oneline -1

      - name: Apply UIScene migration overlay (iOS 27 requirement)
        if: ${{ inputs.patch_uiscene == 'true' }}
        run: |
          set -euo pipefail
          test -d overlay-goguma
          cd overlay-goguma
          find . -type f -print0 | while IFS= read -r -d '' f; do
            rel="${f#./}"
            mkdir -p "../app/$(dirname "$rel")"
            cp "$f" "../app/$rel"
            echo "patched $rel"
          done
          cd ..
          grep -q UIApplicationSceneManifest app/ios/Runner/Info.plist && echo "scene manifest present"
          grep -q FlutterImplicitEngineDelegate app/ios/Runner/AppDelegate.swift && echo "implicit engine delegate present"

      - name: Show Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version: ${{ inputs.flutter_version }}
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: CocoaPods install
        working-directory: app/ios
        env:
          COCOAPODS_DISABLE_STATS: 'true'
        run: |
          set -euo pipefail
          pod --version
          pod install --repo-update || pod install

      - name: Build iOS (no codesign)
        if: ${{ inputs.skip_build != 'true' }}
        working-directory: app
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        if: ${{ inputs.skip_build != 'true' }}
        working-directory: app
        env:
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          ls -la build/ios/iphoneos/
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          if [ -d Payload/Runner.app/Frameworks ]; then
            find Payload/Runner.app/Frameworks -type d -name "*.framework" \
              -exec codesign --force --sign - --preserve-metadata=identifier,entitlements {} \; || true
          fi
          find Payload -name "*.appex" -type d -exec codesign --force --sign - {} \; || true
          OUT="goguma_ios_${LABEL}_no_sign.ipa"
          zip -q -r "$OUT" Payload
          ls -lh "$OUT"
          unzip -l "$OUT" | head -20

      - name: Upload IPA
        if: ${{ inputs.skip_build != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios_outputs_${{ inputs.label }}
          path: app/goguma_ios_*_no_sign.ipa
          if-no-files-found: error
